# PlayGate Host example configuration.
# Copy to config.yaml and adjust for your machine, then run:
#   go run ./cmd/host -config config.yaml

# Video capture source (T2).
capture:
  source: v4l2          # v4l2 (production, Linux) | synthetic (dev test pattern, any OS)
  device: /dev/video0   # V4L2 device node of the capture card (v4l2 only)
  width: 1920           # match a resolution the card advertises for the chosen format
  height: 1080
  fps: 30               # best-effort; the driver clamps to its nearest rate (raw YUYV often caps at 30;
                        # NV12 is half the bandwidth, so many USB cards offer 60fps in NV12)
  format: YUYV          # YUYV | NV12 | MJPEG — must be a format the card lists at this resolution

# Diagnostics: ffmpeg test picture (frame counter + live controller input).
# To try it, set capture.source: testsrc and input.target: overlay:
#   capture:
#     source: testsrc          # needs ffmpeg (encoder.ffmpeg_path); emits NV12
#     width: 1280
#     height: 720
#     fps: 30
#     testsrc:
#       font_file: C:/Windows/Fonts/consola.ttf   # optional; Windows usually needs it
#   input:
#     target: overlay          # writes pressed buttons/sticks/seq to overlay.text_file
#   overlay:
#     text_file: playgate-overlay.txt   # shared by testsrc (reads) and overlay target (writes)

# H.264 encoder (T3: ffmpeg subprocess; T13: hardware codec selection).
encoder:
  bitrate: 6000000      # bits per second (ABR start bitrate when abr.enabled)
  preset: ultrafast     # x264 preset (libx264 only; favour latency over size)
  # gop_seconds: keyframe interval in seconds; GOP frames = round(capture.fps * gop_seconds).
  # Unset picks a backend default: 3 for backend libav (cheap PLI-driven keyframes), 2 for cli.
  # gop_seconds: 2
  # keyframe_debounce_ms: minimum spacing between viewer-triggered ForceKeyframe calls (RTCP PLI,
  # WebCodecs keyframe requests, new viewers). Unset: 150 for libav, 1000 for cli. With the cli
  # backend RTCP PLI is not wired at all (a forced IDR restarts ffmpeg). Supersedes
  # webrtc.video_keyframe_min_interval_ms.
  # keyframe_debounce_ms: 150
  # keyframe_interval: 60 # optional explicit GOP in frames; when > 0 it overrides gop_seconds
  # intra_refresh: false # libx264 only: rolling intra refresh instead of periodic IDR frames (no
  #                       keyframe bitrate spikes; loss heals within one GOP-sized refresh period).
  #                       A new viewer triggers one encoder restart to get its first IDR.
  ffmpeg_path: ffmpeg   # path to the ffmpeg binary
  # H.264 encoder (T13). Default libx264 (software) keeps the original behaviour.
  #   libx264        software / CPU (default, always available)
  #   h264_v4l2m2m   Raspberry Pi hardware encoder (Linux + v4l2 m2m device)
  #   h264_vaapi     Intel/AMD GPU via VA-API (set vaapi_device below)
  #   h264_nvenc     NVIDIA GPU
  # At startup the host probes `ffmpeg -encoders`; if the chosen codec is missing
  # it logs an error telling you to install a suitable ffmpeg or fall back to
  # libx264 (it never silently downgrades).
  codec: libx264
  vaapi_device: /dev/dri/renderD128   # DRM render node (h264_vaapi only)
  # Encoder implementation: cli (ffmpeg subprocess, default) | libav (in-process
  # libav; only in binaries built with CGO_ENABLED=1 -tags libav).
  backend: cli

# Audio capture (ALSA -> Opus). Sent on its own WebRTC track alongside the video;
# the browser resynchronises A/V from each track's RTP timestamps. Disabled by
# default so video-only setups are unaffected.
audio:
  enabled: false
  device: default            # ALSA device, e.g. "hw:CARD=MS2109,DEV=0" for an HDMI grabber
  sample_rate: 48000         # ALSA capture rate (Opus is always 48 kHz on the wire)
  channels: 2
  bitrate: 128000            # Opus bitrate (bits/sec)
  # ffmpeg_path:             # optional; defaults to encoder.ffmpeg_path

# Adaptive bitrate. When enabled, one host-level loop samples WebRTC stats (loss,
# RTT) and adjusts the shared encoder bitrate within [min_bitrate, max_bitrate]
# using AIMD: loss above loss_threshold -> multiplicative decrease; a sustained
# clean link -> additive increase. With several viewers the one holding control
# decides, otherwise the worst viewer; with no viewers the bitrate is held.
# Timing depends on the encoder backend: with a live-bitrate backend
# (encoder.backend: libav) changes apply on the next frame, so cooldown is 500ms
# and the sample interval defaults to 500ms. With the CLI backend every change
# restarts ffmpeg, so cooldown_seconds / sample_interval_ms apply (keyframe
# gating hides the blip).
# Disabled by default: the encoder runs at the fixed encoder.bitrate.
abr:
  enabled: false
  min_bitrate: 1000000    # floor (bits/sec) — bad network degrades to this, never stalls
  max_bitrate: 8000000    # ceiling (bits/sec)
  loss_threshold: 0.05    # packet-loss fraction (0..1) that triggers a decrease
  # WebCodecs viewers (webrtc.video_transport) are covered too: their loss comes
  # from FRAME_REPORTs, and queueing (SCTP RTT well above its recent minimum, or
  # the video send queue filling up) also triggers a decrease below the loss
  # threshold. Needs enabled: true.
  sample_interval_ms: 0   # how often stats are sampled; 0 = 500ms on libav, 2000ms on cli
  cooldown_seconds: 10    # minimum time between two bitrate changes

# Pion WebRTC peer connection (T4). Static ICE servers; used as-is when
# signaling.use_turn is false, and as the fallback when TURN fetch fails.
webrtc:
  ice_servers:
    - stun:stun.l.google.com:19302
  # Video transport (docs/webcodecs-transport.md). NOT the twitch bot's token
  # delivery mode.
  #   track:     RTP H.264 track only (default)
  #   webcodecs: Annex-B fragments over an unreliable DataChannel; the RTP
  #              track stays negotiated as a fallback
  #   auto:      like webcodecs, but each viewer chooses (starts on the track)
  video_transport: track
  video_fragment_bytes: 1200        # DataChannel message size, 600-1400
  video_buffer_max_bytes: 262144    # drop a whole frame above this BufferedAmount
  video_idr_pace_ms: 8              # spread large IDRs over this many ms
  video_fec: "off"                  # off | xor | rs (parity only to viewers that advertise it)
  video_fec_ratio: 0.1              # parity fragments per data fragment, 0-1
  # Google Congestion Control (TWCC) as the ABR input instead of AIMD loss/RTT.
  # Requires encoder.backend: libav (the cli backend restarts ffmpeg per change)
  # and abr.enabled. Target is clamped to abr.min/max_bitrate, smoothed, and
  # applied only on >=5% changes. Viewers on the webcodecs transport send no
  # TWCC and are ignored; if none have an estimate, AIMD is used. The encoder
  # gets 85% of the estimate (headroom for audio, RTX and packet overhead).
  gcc: false
  # video_keyframe_min_interval_ms: legacy alias of encoder.keyframe_debounce_ms (used only when
  # that is unset). Prefer encoder.keyframe_debounce_ms.

# Controller input target (T5).
input:
  # nxbt (Bluetooth via the nxbt daemon, Linux) | gateway (Switch 2 gateway over
  # USB serial, any OS) | log (dev, any OS) | overlay (testsrc picture)
  target: nxbt
  socket_path: /run/nxbt/nxbt.sock  # nxbt only
  rate_hz: 120                    # nxbt only: max commands/second forwarded; 0 disables limiting
  # Switch 2 gateway (ESP32-C6 emulating a Pro Controller 2; see
  # docs/switch2-gateway.md). Pair it with the console first, then plug it in.
  gateway:
    port: auto                    # auto = the single ESP32 USB Serial/JTAG port; or COM5, /dev/ttyACM0
    rate_hz: 150                  # spaces button edges past the gateway's 5-6 ms report throttle (90 for fixed-100Hz firmware)
    keepalive_ms: 40              # re-send a held state (neutral is sent once); the gateway neutralises after 100 ms of silence
  # disabled_buttons drops specific buttons so they are never sent to the Switch.
  # disabled_buttons:
  #   - home
  #   - capture
  #   - plus
  #   - minus

# Single-controller session gate (T9). Disabled by default: every viewer may
# control directly (dev convenience). Enable in production and provide the
# playgate-server ed25519 public key (GET /api/public-key).
session:
  enabled: false
  public_key_base64: ""           # exactly one of these two
  public_key_file: ""
  idle_timeout_seconds: 60        # kick idle controller; 0 disables

# Signaling Worker connection (T7/T8: playgate-signaling on Cloudflare Workers).
signaling:
  url: http://localhost:8787      # Worker base URL, e.g. https://x.workers.dev
  room_id: default
  token: ""                       # optional bearer token for the Worker
  poll_interval_ms: 500
  use_turn: false                 # fetch TURN credentials from the Worker at startup

# Pipeline latency reporting (capture -> encode -> track, p50/p95 logged).
metrics:
  report_interval_seconds: 5
  # Live per-stage latency snapshot as JSON at GET /metrics on this address.
  # Localhost-only (unauthenticated). Empty string disables it.
  listen_addr: "127.0.0.1:9091"

# playgate-server integration (optional). When url is set the host periodically
# POSTs a heartbeat so the streamer console can show the room online/offline
# status and the current controller's viewer id. The server also uses heartbeat
# responses to deliver Force kick requests: when kick_requested=true the host
# immediately removes the current controller through the session idle-kick path.
# Leave url empty (the default) to disable this feature entirely.
server:
  url: ""                          # e.g. http://localhost:8080 — empty disables heartbeats
  api_key: ""                      # host API key from playgate-server register-host
  heartbeat_interval_seconds: 30   # how often to POST; values <= 0 default to 30
